# Pre-commit hooks for the synth-datagen repo (Phase 3, P9).
#
# Install with:
#     pip install pre-commit
#     pre-commit install
#
# Run against the whole repo on demand:
#     pre-commit run --all-files

# `default_install_hook_types` makes a plain `pre-commit install` register
# BOTH the pre-commit and the commit-msg hooks. Without it the commit-msg
# guard below is inert. Contributors who installed hooks before this landed
# must re-run `pre-commit install` once.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Preserve intentional Markdown hard-breaks (lines ending in two
        # spaces) for ``.md`` files — otherwise the bottom metadata block
        # in ``prompts/00_master.md`` and similar docs collapses into a
        # single paragraph. The hook still strips other trailing
        # whitespace in ``.md`` files.
        args: ["--markdown-linebreak-ext=md"]
      - id: check-yaml
        # mkdocs.yml uses Python-specific YAML tags
        # (``!!python/name:pymdownx.superfences.fence_code_format``) for
        # the Mermaid custom fence. The check-yaml hook ships with
        # ``yaml.safe_load``, which refuses those tags. Excluding the
        # single file is safer than enabling the global ``--unsafe``
        # flag (which would allow arbitrary Python construction in any
        # YAML file in the repo). MkDocs itself parses mkdocs.yml with
        # its own loader, and the docs CI lane runs
        # ``mkdocs build --strict`` which catches any real syntax issue.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ruff replaces black/isort/flake8. The official mirror tracks ruff
  # versions and is the recommended pre-commit source.
  #
  # Pinned to match the ruff version installed via the ``[test]`` extra
  # so the pre-commit ``ruff-format`` hook and the CI ``ruff format
  # --check .`` step agree on style. When bumping ruff in pyproject.toml
  # (or pulling a newer one transitively), bump this rev to the same
  # version — otherwise the two formatters fight and CI fails.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs against the source tree only — tests and scripts are
  # excluded for parity with the CI matrix and to keep the hook fast.
  # ``stages: [manual]`` keeps it out of the default ``pre-commit run``
  # path so the hook matches CI's advisory posture: contributors opt in
  # with ``pre-commit run mypy --all-files --hook-stage manual`` (or run
  # ``mypy src/`` directly). Flip back to default stages once the
  # remaining 37 mypy errors in the wider codebase are fixed.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        stages: [manual]
        files: ^src/
        additional_dependencies:
          - "types-PyYAML>=6.0.0"
          - "pydantic>=2.0.0"
        args: ["--ignore-missing-imports"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Mirror the CI invocation exactly: ``bandit -r src/ -ll``.
        # ``pass_filenames: false`` stops pre-commit from appending each
        # changed file path; otherwise -r becomes a no-op per file and
        # output diverges from CI.
        entry: bandit -r src/ -ll
        pass_filenames: false
        files: ^src/

  # Local guards. These encode two conventions previously enforced by review
  # alone, each of which was breached at least once: house typography
  # (en-dash only) and install instructions (this package is not published to
  # any index, so every install must be editable, from a source checkout).
  - repo: local
    hooks:
      - id: no-em-dash-docs
        name: reject em-dash (U+2014) in the public docs surface
        language: pygrep
        # Written as a YAML escape so this config carries no literal em-dash.
        entry: "\u2014"
        files: ^(README|CHANGELOG|CONTRIBUTING|SECURITY)\.md$|^mkdocs\.yml$|^docs/.*\.md$

      - id: no-em-dash-commit-msg
        name: reject em-dash (U+2014) in commit messages
        language: pygrep
        entry: "\u2014"
        # commit-msg stage only. `pre-commit run --all-files` does not exercise
        # this stage, and neither does CI; it is local enforcement.
        stages: [commit-msg]

      - id: no-unpublished-pip-install
        name: reject index-install of synth-datagen (use pip install -e)
        language: pygrep
        # Tempered match: steps forward one character at a time and refuses to
        # cross a ` -e ` token, so the package name is only reachable when no
        # `-e` intervenes. Catches the quoted extras form
        # `pip install 'synth-datagen[pharma]'` that a naive
        # `pip install synth-datagen` pattern misses, which is how six of them
        # survived an earlier repo-wide scan.
        entry: 'pip install(?:(?!\s-e\s)[^\n])*?synth[-_]datagen'
        files: ^(docs|src|examples|scripts)/|^README\.md$
